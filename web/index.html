<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThirdPerspective">
  <title>ThirdPerspective</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='100' y2='100'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M10 50 Q10 10 50 10 Q90 10 90 50 Q90 90 50 90 Q10 90 10 50' fill='none' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 50 Q30 30 50 30 Q70 30 70 50 Q70 70 50 70 Q30 70 30 50' fill='none' stroke='%2322d3ee' stroke-width='4' stroke-dasharray='8,12'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23a855f7'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='180' y2='180'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/defs%3E%3Cpath d='M18 90 Q18 18 90 18 Q162 18 162 90 Q162 162 90 162 Q18 162 18 90' fill='none' stroke='url(%23g)' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M54 90 Q54 54 90 54 Q126 54 126 90 Q126 126 90 126 Q54 126 54 90' fill='none' stroke='%2322d3ee' stroke-width='7' stroke-dasharray='14,22'/%3E%3Ccircle cx='90' cy='90' r='22' fill='%23a855f7'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="fixed inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950" aria-hidden="true"></div>

  <header class="relative z-10 sticky top-0 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800/50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <svg class="w-8 h-8 text-cyan-400" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          <path d="M10 50 Q10 10 50 10 Q90 10 90 50 Q90 90 50 90 Q10 90 10 50" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round"/>
          <path d="M30 50 Q30 30 50 30 Q70 30 70 50 Q70 70 50 70 Q30 70 30 50" stroke="#22d3ee" stroke-width="4" stroke-dasharray="8,12"/>
          <circle cx="50" cy="50" r="12" fill="#a855f7"/>
        </svg>
        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">ThirdPerspective</span>
      </div>

      <nav class="flex items-center gap-1 bg-slate-900/50 rounded-xl p-1 border border-slate-800/50" role="tablist">
        <button data-tab="today" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Today</button>
        <button data-tab="food" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Food</button>
        <button data-tab="body" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Body</button>
        <button data-tab="money" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Money</button>
        <button data-tab="study" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Study</button>
        <button data-tab="tasks" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">Tasks</button>
        <button data-tab="more" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium" role="tab">More</button>
      </nav>

      <button id="settings-btn" class="p-2 rounded-xl hover:bg-slate-800 transition" aria-label="Settings">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main id="app" class="relative z-10 max-w-5xl mx-auto px-4 pb-24"></main>

  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden" role="alert"></div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="glass-card rounded-3xl p-6 w-full max-w-md animate-slide-up">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-white">Settings</h3>
        <button id="close-settings" class="icon-btn" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="label">API Endpoint</label>
          <input id="api-url-input" type="url" class="field" placeholder="https://script.google.com/macros/s/.../exec" />
          <p class="text-[11px] text-slate-500 mt-1">Your Apps Script Web App URL (ends with <code>/exec</code>)</p>
        </div>
        <div>
          <label class="label">App Key (optional)</label>
          <input id="api-key-input" type="password" class="field" placeholder="Leave blank if not using" />
          <p class="text-[11px] text-slate-500 mt-1">Must match the <code>APP_KEY</code> in Script Properties</p>
        </div>
        <div class="pt-2">
          <button id="save-settings-btn" class="btn btn-primary w-full">
            <i data-lucide="save" class="w-4 h-4"></i> Save & Connect
          </button>
        </div>
        <div class="pt-4 border-t border-white/5">
          <p class="text-[11px] text-slate-500 text-center" id="conn-info">Not connected</p>
          <div class="flex gap-2 mt-4">
            <button id="test-btn" class="btn btn-ghost flex-1">Test Backend</button>
            <button id="gemin-test" class="btn btn-ghost flex-1">Test Gemini</button>
          </div>
          <button id="install-btn2" class="btn btn-ghost w-full mt-2 hidden">
            <i data-lucide="download" class="w-4 h-4"></i> Install App
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
